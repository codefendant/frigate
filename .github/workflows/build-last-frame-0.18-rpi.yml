name: Build Last Frame 0.18 RPi Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_rpi:
    runs-on: ubuntu-22.04-arm
    name: Build Frigate 0.18 Raspberry Pi ARM64 image
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version file
        run: make version

      - name: Build and push Raspberry Pi image
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          targets: rpi
          files: docker/rpi/rpi.hcl
          set: |
            rpi.tags=ghcr.io/codefendant/frigate:last-frame-0.18-rpi
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
