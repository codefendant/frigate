name: Validate Re-enable Regression

on:
  workflow_dispatch:
  push:
    branches:
      - validation/reenable-regression

permissions:
  contents: read

jobs:
  web:
    name: Web regression validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - run: npm install
        working-directory: ./web
      - name: Lint
        run: npm run lint
        working-directory: ./web
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ./web
      - name: Build web for E2E
        run: npm run e2e:build
        working-directory: ./web
      - name: Run re-enable regression test
        run: npx playwright test --config e2e/playwright.config.ts e2e/specs/live-reenable.spec.ts
        working-directory: ./web
